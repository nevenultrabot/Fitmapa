<!-- Supabase → Authentication → Emails → Templates → "Reset Password"
     Subject (naslov): Tvoj kod za novu lozinku — FitMapa
     Body (sadržaj): nalepi sve ispod ove linije -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #14161a;">
  <h2 style="margin: 0 0 12px;">Promena lozinke</h2>
  <p style="margin: 0 0 16px;">Neko je zatražio novu lozinku za tvoj FitMapa nalog. Upiši ovaj kod u aplikaciju:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; background: #f4f4ef; border-radius: 12px; padding: 16px; text-align: center; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; color: #6b6f76; font-size: 14px;">Kod važi kratko vreme. Ako nisi ti tražio promenu, samo ignoriši ovaj email — lozinka ostaje ista.</p>
</div>
